<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KrishiBandhu - Smart Farming</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="welcome-container">

        <div class="logo">
            🌱
        </div>

        <h1>KrishiBandhu</h1>

        <p class="tagline">Smart Farming. Better Decisions.</p>

        <div class="login-card">

            <h2>Welcome, Farmer</h2>
            <p>Enter your details to continue</p>

            <label>Mobile Number</label>
            <input type="tel" id="mobile" placeholder="Enter mobile number">

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password">

            <label>Language</label>
            <select id="language">
                <option>English</option>
                <option>ಕನ್ನಡ</option>
            </select>

            <button onclick="continueToProfile()">Continue</button>

        </div>

        <p class="bottom-text">
            Empowering farmers with AI-powered agricultural support.
        </p>

    </div>

    <script src="script.js"></script>

</body>
</html>
